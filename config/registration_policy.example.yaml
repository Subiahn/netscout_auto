description: "DUMMY policy example. Copy to registration_policy.yaml and review locally."

defaults:
  registration_type: "SBA"
  parent_application: "TCP"
  protocol: "TCP"
  application_name: ""
  application_group: ""
  application_tag: "AUTO_REVIEW"

application_rules:
  - match: "HTTPS"
    application_name: "DUMMY_HTTPS_{port}"
    registration_type: "SBA"
    parent_application: "TCP"
    protocol: "TCP"

  - match: "UDP_OTHER"
    application_name: "DUMMY_UDP_{port}"
    registration_type: "SBA"
    parent_application: "UDP"
    protocol: "UDP"
